safety:

  # ==========================
  # IMU安全监测
  # ==========================

  # IMU超时时间（秒）
  imu_timeout_sec: 1.0

  # ==========================
  # 电机安全监测
  # ==========================

  # 电机反馈超时时间（秒）
  motor_timeout_sec: 1.0

  # 电机位置接近限位的预警范围（度）
  motor_limit_margin_deg: 5.0

  # ==========================
  # 绳索安全监测
  # ==========================

  # 松绳判定阈值（mm）
  tendon_slack_threshold_mm: 0.5

  # ==========================
  # 模型残差监测
  # ==========================

  # 残差超限阈值（度）
  residual_limit_deg: 10.0

  # ==========================
  # 急停配置
  # ==========================

  # 是否允许软件解除急停
  allow_clear_estop: true

  # ==========================
  # SafetyState总开关
  # ==========================

  enable_imu_timeout_check: true

  enable_motor_timeout_check: true

  enable_motor_limit_check: true

  enable_tendon_slack_check: true

  enable_residual_check: true

  enable_estop_check: true
