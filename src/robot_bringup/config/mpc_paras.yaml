mpc_node:
  ros__parameters:

    # ==========================
    # MPC基础参数
    # ==========================

    control_rate_hz: 5.0        # 第一版先低频，避免电机频繁动作
    enable_control: true        # 是否允许MPC输出控制

    # ==========================
    # 电机控制参数
    # ==========================

    motor_ids: [1, 2, 3, 4, 5, 6]

    default_speed_rad_s: 0.3    # 第一版低速控制，保证安全

    max_delta_deg_per_step: 1.0 # 每个控制周期最大电机增量，单位deg

    motor_position_limit_deg:
      1: [-180.0, 180.0]
      2: [-180.0, 180.0]
      3: [-180.0, 180.0]
      4: [-180.0, 180.0]
      5: [-180.0, 180.0]
      6: [-180.0, 180.0]

    # ==========================
    # 姿态误差控制增益
    # 第一版为经验增益，不是真正优化器
    # ==========================

    section1_roll_gain: 0.2
    section1_pitch_gain: 0.2

    section2_roll_gain: 0.2
    section2_pitch_gain: 0.2

    # ==========================
    # 简化电机分配关系
    # 后续可用实验辨识B矩阵替代
    # ==========================

    # section1由电机1、3、5控制
    section1_motor_ids: [1, 3, 5]

    # section2由电机2、4、6控制
    section2_motor_ids: [2, 4, 6]
