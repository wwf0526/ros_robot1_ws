# IMU 配置部分
dual_imu_serial_node:
  ros__parameters:
    port: /dev/ttyUSB0               # 串口设备号
    baudrate: 115200                 # 串口波特率
    publish_rate: 200.0              # 发布频率（Hz）
    imu1_topic: /imu1/data_raw       # IMU1话题名
    imu2_topic: /imu2/data_raw       # IMU2话题名
    imu1_frame_id: imu1_link         # IMU1坐标系
    imu2_frame_id: imu2_link         # IMU2坐标系
    status_period: 5.0               # 状态输出周期（秒）

# 电机配置部分(使用socketcan)
motor_node:
  ros__parameters:
    interface: socketcan              # 使用SocketCAN统一接口
    primary_channel: can0             # 第一条CAN总线（电机1-3）
    secondary_channel: can1           # 第二条CAN总线（电机4-6）
    bitrate: 1000000                  # CAN总线波特率
    feedback_id: 10                   # 电机状态反馈CAN ID
    microstep: 32                     # 步进电机微步设置
    feedback_service_timeout_sec: 0.1 # 服务调用等待单次反馈的上限
    motor_ids: [1, 2, 3, 4, 5, 6]    # 六台电机ID
    secondary_ids: [4, 5, 6]          # 第二路CAN的电机
    command_topic: /motor/raw_command # 仅闭环执行层使用的底层相对位移话题
    command_array_topic: /motor/raw_command_array
    state_topic: /motor/state         # 电机状态ROS2话题
    feedback_request_rate_hz: 300.0   # 六电机轮询总频率，约50Hz/电机
    feedback_publish_rate_hz: 200.0
    safety_timeout_sec: 0.25
    controller_state_timeout_sec: 0.5
    require_safety_state: true
    max_relative_command_deg: 1.5
    max_speed_rad_s: 1.0
    zero_file: "~/.ros/ros_robot1/zero_offsets.json"
    
